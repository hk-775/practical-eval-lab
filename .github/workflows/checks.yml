name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.7"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked python -m scripts.browser_check
      - run: uv run --locked python -m eval_lab compare --suite classification
      - run: uv run --locked python -m eval_lab compare --suite extraction
      - run: uv run --locked python -m eval_lab compare --suite tool_calling
      - run: git diff --exit-code
