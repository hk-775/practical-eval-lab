name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.7"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m benchmarks.decision_models.build_cases --check
      - run: uv run --locked python -m benchmarks.decision_models validate
      - run: uv run --locked python -m benchmarks.tool_workflow.data --check
      - run: uv run --locked python -m benchmarks.tool_workflow validate
      - run: uv run --locked python -m scripts.package_check
      - run: uv run --locked playwright install --with-deps chromium
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
      - run: uv run --locked python -m scripts.browser_check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
      - run: uv run --locked python -m scripts.reproduce_portfolio
      - run: uv run --locked python -m scripts.render_incidents --check
      - run: uv run --locked eval-lab compare --suite classification --project examples/python-project.json --before app-v1 --after app-v2
      - run: git diff --exit-code
