<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc"><title id="title">Practical Eval Lab logical architecture</title><desc id="desc">Input goes to a named candidate. References go directly to the grader. Candidate outputs and grader checks form a saved experiment. The CLI and local webpage share this runner.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#0D1B2A"/></marker></defs><rect width="1080" height="330" fill="#F8F5F0"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#1A1A1A"><path d="M138 100 V50 H674 V100" fill="none" stroke="#0D1B2A" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="405" y="34" font-size="15">References go directly to the grader</text><rect x="28" y="100" width="220" height="100" rx="14" fill="#F8F5F0" stroke="#0D1B2A" stroke-width="2"/><text x="138" y="139" font-size="19" font-weight="700">Dataset</text><text x="138" y="169" font-size="13">Input + reference + tags</text><rect x="296" y="100" width="220" height="100" rx="14" fill="#F8F5F0" stroke="#0D1B2A" stroke-width="2"/><text x="406" y="139" font-size="19" font-weight="700">Named candidate</text><text x="406" y="169" font-size="13">Local · Python · HTTP · model</text><rect x="564" y="100" width="220" height="100" rx="14" fill="#F8F5F0" stroke="#0D1B2A" stroke-width="2"/><text x="674" y="139" font-size="19" font-weight="700">Grader</text><text x="674" y="169" font-size="13">Checks + trace replay</text><rect x="832" y="100" width="220" height="100" rx="14" fill="#F8F5F0" stroke="#0D1B2A" stroke-width="2"/><text x="942" y="139" font-size="19" font-weight="700">Saved experiment</text><text x="942" y="169" font-size="13">Slices · gates · JSON / HTML</text><path d="M248 150 H288" stroke="#0D1B2A" stroke-width="2" marker-end="url(#arrow)"/><text x="272" y="220" font-size="12">input only</text><path d="M516 150 H556" stroke="#0D1B2A" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="220" font-size="12">output</text><path d="M784 150 H824" stroke="#0D1B2A" stroke-width="2" marker-end="url(#arrow)"/><text x="808" y="220" font-size="12">verdict</text><rect x="28" y="245" width="1024" height="65" rx="12" fill="#F8F5F0"/><text x="540" y="272" font-size="16" font-weight="700">CLI + local tuning webpage use the same runner</text><text x="540" y="296" font-size="14">Versioned profiles · candidate registrations · saved-run history · compatible comparisons</text></g></svg>