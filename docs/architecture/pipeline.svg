<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Practical Eval Lab architecture</title><desc id="desc">Dataset flows through a candidate, grader, and report. A local tuning profile configures cases and grading. CLI and webpage share one Python runner.</desc>
<rect width="960" height="300" rx="18" fill="#f3f1ea"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#214e3b"/></marker></defs>
<text x="32" y="38" font-family="sans-serif" font-size="18" fill="#19221d">One Python runner · CLI and local webpage</text>
<rect x="32" y="76" width="200" height="90" rx="12" fill="#fffdf7" stroke="#214e3b"/>
<text x="48" y="109" font-family="sans-serif" font-size="20" fill="#214e3b">Dataset</text>
<text x="48" y="139" font-family="sans-serif" font-size="12" fill="#657069">Inputs + expected answers</text>
<rect x="264" y="76" width="200" height="90" rx="12" fill="#fffdf7" stroke="#214e3b"/>
<text x="280" y="109" font-family="sans-serif" font-size="20" fill="#214e3b">Candidate</text>
<text x="280" y="139" font-family="sans-serif" font-size="12" fill="#657069">Baseline, improved, or live</text>
<path d="M232,121 H259" stroke="#214e3b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="496" y="76" width="200" height="90" rx="12" fill="#fffdf7" stroke="#214e3b"/>
<text x="512" y="109" font-family="sans-serif" font-size="20" fill="#214e3b">Grader</text>
<text x="512" y="139" font-family="sans-serif" font-size="12" fill="#657069">Rules + reference answers</text>
<path d="M464,121 H491" stroke="#214e3b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="728" y="76" width="200" height="90" rx="12" fill="#fffdf7" stroke="#214e3b"/>
<text x="744" y="109" font-family="sans-serif" font-size="20" fill="#214e3b">Report</text>
<text x="744" y="139" font-family="sans-serif" font-size="12" fill="#657069">Cases, slices, and gate</text>
<path d="M696,121 H723" stroke="#214e3b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="32" y="201" width="896" height="65" rx="12" fill="#dfe9df"/>
<text x="50" y="227" font-family="sans-serif" font-size="16" fill="#214e3b">Local tuning profile</text>
<text x="50" y="249" font-family="sans-serif" font-size="13" fill="#19221d">Editable development cases · grader settings · passing threshold · saved history</text>
</svg>
