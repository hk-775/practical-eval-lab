<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" class="workflow" viewBox="0 0 960 150" role="img" aria-label="Failure feedback, bounded edits, execution, fixed verification, retained version"><style>svg{background:#F8F5F0}rect{fill:#0D1B2A}text{fill:#F8F5F0;font:650 14px Arial,sans-serif}text.loop-label{fill:#546474;font-size:12px;font-weight:400}.flow-line{fill:none;stroke:#007B95;stroke-width:2;stroke-dasharray:5 5}</style><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#007B95"/></marker></defs><rect x="20" y="35" width="160" height="54" rx="8"/><text x="100" y="67" text-anchor="middle">Observe failures</text><rect x="210" y="35" width="160" height="54" rx="8"/><text x="290" y="67" text-anchor="middle">Propose edits</text><rect x="400" y="35" width="160" height="54" rx="8"/><text x="480" y="67" text-anchor="middle">Execute</text><rect x="590" y="35" width="160" height="54" rx="8"/><text x="670" y="67" text-anchor="middle">Verify</text><rect x="780" y="35" width="160" height="54" rx="8"/><text x="860" y="67" text-anchor="middle">Retain version</text><path class="flow-line" d="M183 62 H206" marker-end="url(#arrow)"/><path class="flow-line" d="M373 62 H396" marker-end="url(#arrow)"/><path class="flow-line" d="M563 62 H586" marker-end="url(#arrow)"/><path class="flow-line" d="M753 62 H776" marker-end="url(#arrow)"/><path class="flow-line" d="M860 94 V120 H100 V96" marker-end="url(#arrow)"/><text class="loop-label" x="480" y="143" text-anchor="middle">Accepted optimizer edits guide the next generation</text></svg>
