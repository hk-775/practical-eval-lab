<svg xmlns="http://www.w3.org/2000/svg" class="recovery-flow" viewBox="0 0 1000 150" role="img" aria-label="Refund committed, lookup misses, exact retry finds receipt, final state verified."><style>.recovery-flow{background:#F8F5F0}.recovery-flow rect{fill:#0D1B2A}.recovery-flow text{fill:#F8F5F0;font:600 18px Arial,sans-serif}.recovery-flow .flow-sub{font-size:14px;font-weight:400;fill:#8BE6F7}.recovery-flow .recovery-connector{fill:none;stroke:#007B95;stroke-width:3;stroke-dasharray:5 5}.recovery-flow .arrow{fill:#007B95}</style><g data-flow-step="0"><rect x="0" y="20" width="235" height="100" rx="12"/><text x="18" y="59">1. Refund committed</text><text class="flow-sub" x="18" y="90">Response lost</text></g><path class="recovery-connector" d="M239 70h10"/><path class="arrow" d="M245 65l7 5-7 5Z"/><g data-flow-step="1"><rect x="255" y="20" width="235" height="100" rx="12"/><text x="273" y="59">2. Lookup misses</text><text class="flow-sub" x="273" y="90">Effect still exists</text></g><path class="recovery-connector" d="M494 70h10"/><path class="arrow" d="M500 65l7 5-7 5Z"/><g data-flow-step="2"><rect x="510" y="20" width="235" height="100" rx="12"/><text x="528" y="59">3. Exact retry</text><text class="flow-sub" x="528" y="90">Existing receipt</text></g><path class="recovery-connector" d="M749 70h10"/><path class="arrow" d="M755 65l7 5-7 5Z"/><g data-flow-step="3"><rect x="765" y="20" width="235" height="100" rx="12"/><text x="783" y="59">4. Verify state</text><text class="flow-sub" x="783" y="90">Complete</text></g></svg>
