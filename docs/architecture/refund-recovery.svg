<svg xmlns="http://www.w3.org/2000/svg" class="recovery-flow" viewBox="0 0 1000 150" role="img" aria-label="Refund committed, lookup misses, exact retry finds receipt, final state verified."><style>.recovery-flow{background:#F8F5F0}.recovery-flow rect{fill:#0D1B2A}.recovery-flow text{fill:#F8F5F0;font:600 18px Arial,sans-serif}.recovery-flow .flow-sub{font-size:14px;font-weight:400;fill:#8BE6F7}.recovery-flow .recovery-connector{fill:none;stroke:#007B95;stroke-width:3;stroke-dasharray:5 5}.recovery-flow .arrow{fill:#007B95}</style><g data-flow-step="0"><rect x="0" y="20" width="220" height="100" rx="12"/><text x="18" y="59">1. Refund committed</text><text class="flow-sub" x="18" y="90">Response lost</text></g><path class="recovery-connector" d="M224 70h29"/><path class="arrow" d="M249 65l7 5-7 5Z"/><g data-flow-step="1"><rect x="260" y="20" width="220" height="100" rx="12"/><text x="278" y="59">2. Lookup misses</text><text class="flow-sub" x="278" y="90">Effect still exists</text></g><path class="recovery-connector" d="M484 70h29"/><path class="arrow" d="M509 65l7 5-7 5Z"/><g data-flow-step="2"><rect x="520" y="20" width="220" height="100" rx="12"/><text x="538" y="59">3. Exact retry</text><text class="flow-sub" x="538" y="90">Existing receipt</text></g><path class="recovery-connector" d="M744 70h29"/><path class="arrow" d="M769 65l7 5-7 5Z"/><g data-flow-step="3"><rect x="780" y="20" width="220" height="100" rx="12"/><text x="798" y="59">4. Verify state</text><text class="flow-sub" x="798" y="90">Complete</text></g></svg>
